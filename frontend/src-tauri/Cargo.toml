[package]
name = "zhihuishu-desk"
version = "1.3.3"
description = "智慧树学习助手"
authors = ["zhihuishu-desk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zhihuishu_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
