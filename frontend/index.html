<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4F1EA" />
    <title>智慧树助手 · 学习台账</title>
    <!-- 预置启动屏：内联样式，React 打包产物加载前就能铺满窗口，避免黑屏/白闪 -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f4f1ea;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background:
          radial-gradient(920px 460px at 8% -10%, #fbfaf5, transparent 62%),
          radial-gradient(720px 420px at 94% 108%, rgba(173, 59, 45, 0.07), transparent 64%),
          #f4f1ea;
        color: #16201a;
        font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }

      #boot-splash.is-gone {
        opacity: 0;
        visibility: hidden;
      }

      #boot-splash .splash-logo {
        width: 62px;
        height: 62px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 16px 32px -20px rgba(22, 32, 26, 0.5);
        animation: splash-bob 2.6s ease-in-out infinite;
      }

      #boot-splash .splash-title {
        margin-top: 2px;
        font-family: "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
      }

      #boot-splash .splash-hint {
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: #6b7568;
      }

      #boot-splash .splash-bar {
        width: 132px;
        height: 2px;
        margin-top: 4px;
        border-radius: 2px;
        background: rgba(22, 32, 26, 0.14);
        overflow: hidden;
      }

      #boot-splash .splash-bar::after {
        content: "";
        display: block;
        width: 46%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(173, 59, 45, 0), #ad3b2d);
        animation: splash-slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes splash-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }

      @keyframes splash-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .splash-logo,
        #boot-splash .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <img class="splash-logo" src="/frog.png" alt="" />
      <div class="splash-title">智慧树助手</div>
      <div class="splash-hint">正在启动本地学习引擎</div>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
